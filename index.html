<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Weather Forecast</title>

    <link rel="icon" href="images/favicon.png">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <h1>
            <i class="fa-solid fa-cloud-sun"></i>
            Real-Time Weather Forecast
        </h1>

        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name...">

            <button id="searchBtn" title="Search">
                <i class="fas fa-search"></i>
            </button>

            <button id="locationBtn" title="Current Location">
                <i class="fas fa-location-dot"></i>
            </button>

            <button id="themeBtn" title="Dark Mode">
                🌙
            </button>

        </div>

        <!-- Loading -->

        <div id="loading" class="loading">
            <div class="loader"></div>
            <p>Loading weather...</p>
        </div>

        <!-- Weather Card -->

        <div class="weather-card">

            <h2 id="cityName">
                City Name
            </h2>

            <img
                id="weatherIcon"
                src=""
                alt="Weather Icon">

            <h1 id="temperature">
                --°C
            </h1>

            <p id="description">
                Weather Description
            </p>

            <p id="dateTime"></p>

        </div>

        <!-- Weather Details -->

        <div class="details">

            <div class="detail-box">
                <h3>💧 Humidity</h3>
                <p id="humidity">--%</p>
            </div>

            <div class="detail-box">
                <h3>💨 Wind</h3>
                <p id="wind">-- km/h</p>
            </div>

            <div class="detail-box">
                <h3>🌡 Feels Like</h3>
                <p id="feelsLike">--°C</p>
            </div>

            <div class="detail-box">
                <h3>📊 Pressure</h3>
                <p id="pressure">-- hPa</p>
            </div>

            <div class="detail-box">
                <h3>🌅 Sunrise</h3>
                <p id="sunrise">--</p>
            </div>

            <div class="detail-box">
                <h3>🌇 Sunset</h3>
                <p id="sunset">--</p>
            </div>

            <div class="detail-box">
                <h3>🌍 Air Quality</h3>
                <p id="aqi">--</p>
            </div>

        </div>

        <!-- Forecast -->

        <h2 class="forecast-title">
            5-Day Forecast
        </h2>

        <div
            id="forecast"
            class="forecast-container">

        </div>

        <!-- Footer -->

        <footer>

            <p>
                Developed by
                <strong>Mahesh Anjan Kumar</strong>
                ❤️
            </p>

        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
